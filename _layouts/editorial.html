---
layout: default
---

{% include base_path %}

<main id="main" class="editorial-shell" role="main">
  <header class="page-header">
    {% if page.kicker %}
      <p class="section__kicker">{{ page.kicker }}</p>
    {% endif %}
    <h1 class="page-header__title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-header__subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <div class="editorial-body">
    {{ content }}
  </div>
</main>
