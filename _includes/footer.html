{% include base_path %}

<div class="site-footer__inner">
  <div class="site-footer__left">
    <span class="site-footer__name">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}</span>
    <span class="site-footer__sep" aria-hidden="true">&middot;</span>
    <span class="site-footer__meta">AI &amp; Data Systems Research</span>
  </div>
  <div class="site-footer__links">
    {% if site.author.email %}
      <a href="mailto:{{ site.author.email }}">Email</a>
    {% endif %}
    {% if site.author.googlescholar %}
      <a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer">Google Scholar</a>
    {% endif %}
    {% if site.author.arxiv %}
      <a href="{{ site.author.arxiv }}" target="_blank" rel="noopener noreferrer">arXiv</a>
    {% endif %}
    <a href="{{ base_path }}/publications/">Publications</a>
    <a href="{{ base_path }}/talks/">Talks</a>
  </div>
</div>
